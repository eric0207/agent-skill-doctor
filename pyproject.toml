[project]
name = "agent-skill-doctor"
version = "0.1.0"
description = "Local static checker for Agent Skills"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "pydantic>=2.7,<3", "PyYAML>=6,<7"]

[project.scripts]
skill-doctor = "skill_doctor.cli:app"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "jsonschema>=4,<5"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_doctor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
